# Example deployment. Adjust the bind-mount path and port for your host, then:
#   docker compose build && docker compose up -d
services:
  recipe-import:
    build: ..
    image: recipe-import:local
    container_name: recipe-import
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    tmpfs:
      # Keeps yt-dlp's temp/subtitle writes off the host filesystem - never video
      # or audio, see src/sources/youtube.py.
      - /tmp:size=256m
    mem_limit: 512m
    env_file:
      - .env
    healthcheck:
      # No curl/wget in the base image, so this goes through the Python interpreter
      # that's already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
