name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Vor pytest: ein Stilverstoss meldet sich in einer Sekunde statt nach der Suite.
      - run: ruff check src tests
      - run: pytest
