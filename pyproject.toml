# Nur Werkzeugkonfiguration. Bewusst ohne [build-system] und [project]: das Projekt
# wird nicht paketiert, die Module liegen flach in src/ und werden vom Container nach
# /app kopiert. pip install -r requirements.txt verhält sich unverändert.

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# Explizit benannt statt von ruffs Defaults geerbt: der Default-Satz wandert zwischen
# Releases, und gepinnte Version plus feste Liste heißt, dass ein Versionssprung nie
# stillschweigend neue Funde in einen grünen Build trägt.
select = ["E", "F", "I", "B", "BLE", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI baut seine Parameter-Defaults genau auf diesen Aufrufen auf; B008 ist hier
# kein Fehler, sondern die vorgesehene Schreibweise.
extend-immutable-calls = ["fastapi.File", "fastapi.Header", "fastapi.Depends"]
